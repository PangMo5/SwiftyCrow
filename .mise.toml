[tools]
swiftformat = "0.64.5"

[env]
_.source = "scripts/xcode-env.sh"

[tasks.format]
description = "Format Swift sources with the Airbnb style"
run = "swiftformat ."

[tasks."format:check"]
description = "Check Swift formatting without changing files"
run = "swiftformat --lint ."

[tasks.generate]
description = "Resolve the Swift package dependencies"
run = "swift package resolve"

[tasks.build]
description = "Build and sign the macOS app (debug by default; accepts release)"
run = "bash scripts/build-app.sh"

[tasks.test]
description = "Run the app's Swift package tests"
run = "swift test"
