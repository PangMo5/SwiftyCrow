name: Deploy site

# Publishes the marketing/docs site to GitHub Pages independently of releases.
# The release workflow owns appcast.xml (it signs + regenerates it); this
# workflow re-publishes the currently live appcast alongside the site so a site
# deploy never wipes the Sparkle feed.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Resources/Marketing/app-icon.png"
      - "Resources/Marketing/demo.gif"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.release.outputs.should-deploy }}
    steps:
      - uses: actions/checkout@v6

      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^let appVersion = "([^"]+)"/\1/p' Project.swift)"
          RELEASE_VERSION="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$RELEASE_VERSION" ] || [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages: app version ${APP_VERSION:-<unknown>} is ahead of latest release ${RELEASE_VERSION:-<none>}"
            exit 0
          fi
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        if: steps.release.outputs.should-deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"

          # Latest release version for the no-JS download/version fallback in
          # index.html (the page also resolves this live via the API).
          echo "Latest version: $VERSION"

          cp web/*.html web/*.css "$SITE/"
          sed -i "s/__VERSION__/${VERSION}/g" "$SITE/index.html"
          cp Resources/Marketing/app-icon.png "$SITE/icon.png"
          cp Resources/Marketing/demo.gif "$SITE/demo.gif"

          # Cache-bust the stylesheet so a CSS change is never masked by a
          # stale browser cache (HTML + CSS stay in lockstep per deploy).
          BUST="${GITHUB_SHA:0:8}"
          sed -i "s#\"./style.css\"#\"./style.css?v=${BUST}\"#g" "$SITE"/*.html

          # Preserve the Sparkle feed. The latest release asset is canonical,
          # while the live site is only a fallback for older releases that did
          # not publish appcast.xml. This also prevents a release-preparation
          # commit from winning same-SHA Pages deduplication with a stale feed.
          if gh release download --repo "$REPO" --pattern appcast.xml --dir "$SITE" 2>/dev/null; then
            echo "Bundled appcast.xml from the latest release asset"
          else
            OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            NAME="${REPO##*/}"
            curl -fsSL "https://${OWNER_LC}.github.io/${NAME}/appcast.xml" -o "$SITE/appcast.xml"
            echo "Bundled appcast.xml from the live site (no release asset)"
          fi
          echo "appcast.xml: $(wc -c < "$SITE/appcast.xml") bytes"

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.should-deploy == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
