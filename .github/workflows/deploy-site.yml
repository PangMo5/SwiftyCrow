name: Deploy site

# Publishes the website and the latest signed appcast to Workers Static Assets.
# Release workflows also deploy their signed appcast with the matching site.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Resources/Marketing/app-icon.png"
      - "Resources/Marketing/demo.gif"
      - ".github/workflows/deploy-site.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.release.outputs.should-deploy }}
    steps:
      - uses: actions/checkout@v6

      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^let appVersion = "([^"]+)"/\1/p' Project.swift)"
          RELEASE_VERSION="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$RELEASE_VERSION" ] || [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping site: app version ${APP_VERSION:-<unknown>} is ahead of latest release ${RELEASE_VERSION:-<none>}"
            exit 0
          fi
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        if: steps.release.outputs.should-deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"

          # Latest release version for the no-JS download/version fallback in
          # index.html (the page also resolves this live via the API).
          echo "Latest version: $VERSION"

          cp web/*.html web/*.css "$SITE/"
          sed -i "s/__VERSION__/${VERSION}/g" "$SITE/index.html"
          cp Resources/Marketing/app-icon.png "$SITE/icon.png"
          cp Resources/Marketing/demo.gif "$SITE/demo.gif"

          # Cache-bust the stylesheet so a CSS change is never masked by a
          # stale browser cache (HTML + CSS stay in lockstep per deploy).
          BUST="${GITHUB_SHA:0:8}"
          sed -i "s#\"./style.css\"#\"./style.css?v=${BUST}\"#g" "$SITE"/*.html

          # Every deployment must include the latest signed release feed.
          # Fail if it is unavailable instead of publishing a stale or missing feed.
          gh release download "v${VERSION}" --repo "$REPO" \
            --pattern appcast.xml --dir "$SITE"
          echo "appcast.xml: $(wc -c < "$SITE/appcast.xml") bytes"

      - name: Add static asset headers
        if: steps.release.outputs.should-deploy == 'true'
        run: cp web/_headers "$RUNNER_TEMP/site/_headers"

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.should-deploy == 'true'
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://swiftycrow.pangmo5.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.2"
          command: deploy
