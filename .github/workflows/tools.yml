name: Automation tools

on:
  push:
    branches: ["pangmo5/release-*"]
  pull_request:
    paths:
      - "**/*.swift"
      - "**/.swiftformat"
      - ".swiftformat"
      - ".mise.toml"
      - ".xcode-version"
      - "scripts/**"
      - "App/**"
      - "Package.resolved"
      - "VERSION"
      - "Tools/**"
      - "DemoLab/**"
      - "Localization/**"
      - "Resources/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "web/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: swiftformat
      - run: mise run format:check

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"
      - uses: jdx/mise-action@v5
      - run: mise run generate
      - name: Test app and recorder with the selected Xcode SDK
        run: |
          mise run test
          mise exec -- swift test --package-path DemoLab/Recorder
      - name: Verify the app bundle
        env:
          SWIFTYCROW_DEVELOPMENT_IDENTITY: "-"
        run: mise run build

  portable-tools:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install video metadata tools
        run: apt-get update && apt-get install -y ffmpeg
      - name: Test Swift automation and verify reviewed media
        run: |
          swift test --package-path Tools
          swift run --package-path Tools swiftycrow-tools check
          swift run --package-path Tools swiftycrow-tools docs --check
          swift run --package-path Tools swiftycrow-tools verify-media --source DemoLab/Edits/review-bundle.json --portable
          swift run --package-path Tools swiftycrow-tools check-release --allow-unreleased --version "$(cat VERSION)"
          swift run --package-path Tools swiftycrow-tools site --output /tmp/swiftycrow-site
